# office-imp atrás de um nginx que já existe na VPS (o do CRM, por exemplo).
# Salve como /etc/nginx/conf.d/office-imp.conf, troque os domínios se precisar e rode:
#   nginx -t && systemctl reload nginx
# Depois emita os certificados:  certbot --nginx -d DOMINIO -d RTC_DOMINIO
map $http_upgrade $office_imp_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name office-impera.imperaservices.com;
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $office_imp_connection;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

server {
    listen 80;
    server_name rtc-office-impera.imperaservices.com;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $office_imp_connection;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
