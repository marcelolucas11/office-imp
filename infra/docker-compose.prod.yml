# office-imp — produção. Gerado/instalado pelo infra/install.sh em /opt/office-imp/docker-compose.yml.
# Nada aqui usa as portas 80/443 (a não ser o perfil opcional "caddy"); os serviços do CRM não são tocados.
name: office-imp

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    <<: *common
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: officeimp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: officeimp
    volumes:
      - officeimp_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U officeimp -d officeimp"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits: { memory: 512M }

  redis:
    <<: *common
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits: { memory: 192M }

  # Servidor de áudio e vídeo (SFU). Sinalização em 7880 (atrás do proxy, com TLS);
  # mídia direto pelas portas 7881/tcp e 7882/udp, que precisam estar abertas para a internet.
  livekit:
    <<: *common
    image: livekit/livekit-server:${LIVEKIT_VERSION:-v1.13.10}
    command: ["--node-ip", "${PUBLIC_IP:?defina PUBLIC_IP no .env}"]
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
        redis:
          address: redis:6379
        keys:
          ${LIVEKIT_API_KEY:?defina LIVEKIT_API_KEY no .env}: ${LIVEKIT_API_SECRET:?defina LIVEKIT_API_SECRET no .env}
        room:
          auto_create: true
          empty_timeout: 60
        logging:
          level: info
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${LIVEKIT_PORT:-7880}:7880"
      - "7881:7881/tcp"
      - "7882:7882/udp"
    depends_on:
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 768M }

  # Grava o áudio das reuniões (uma faixa por participante, sem vídeo) para as notas.
  egress:
    <<: *common
    image: livekit/egress:${EGRESS_VERSION:-v1.15.0}
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        insecure: true
        redis:
          address: redis:6379
        logging:
          level: info
    volumes:
      - officeimp_data:/data
    cap_add: [SYS_ADMIN]
    depends_on:
      livekit: { condition: service_started }
    deploy:
      resources:
        limits: { cpus: "${EGRESS_CPUS:-1.5}", memory: 1G }

  # Transcrição local (whisper.cpp). O modelo é baixado na primeira execução.
  whisper:
    <<: *common
    image: ${WHISPER_IMAGE:-ghcr.io/marcelolucas11/office-imp-whisper}:${OFFICE_IMP_VERSION:-latest}
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-auto}
      WHISPER_THREADS: ${WHISPER_THREADS:-2}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-pt}
    volumes:
      - officeimp_models:/models
    deploy:
      resources:
        limits: { cpus: "${WHISPER_CPUS:-2}", memory: 2G }

  app:
    <<: *common
    image: ${OFFICE_IMP_IMAGE:-ghcr.io/marcelolucas11/office-imp}:${OFFICE_IMP_VERSION:-latest}
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?defina PUBLIC_URL no .env}
      DATABASE_URL: postgres://officeimp:${POSTGRES_PASSWORD}@postgres:5432/officeimp
      REDIS_URL: redis://redis:6379
      APP_SECRET: ${APP_SECRET:?defina APP_SECRET no .env}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?defina APP_ENCRYPTION_KEY no .env}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      LIVEKIT_URL: ${LIVEKIT_PUBLIC_URL:?defina LIVEKIT_PUBLIC_URL no .env}
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      EGRESS_OUT_DIR: /data/meetings
      WHISPER_URL: http://whisper:8080
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-pt}
      SUMMARY_LLM_URL: ${SUMMARY_LLM_URL:-}
      SUMMARY_LLM_MODEL: ${SUMMARY_LLM_MODEL:-}
      SUMMARY_LLM_KEY: ${SUMMARY_LLM_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      UPDATER_URL: http://updater:8787
      UPDATER_TOKEN: ${UPDATER_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-marcelolucas11/office-imp}
    volumes:
      - officeimp_data:/data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${APP_PORT:-3080}:3000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 768M }

  # Acionado pelo botão "Atualizar servidor" (só o Dono). Só atualiza os serviços do office-imp.
  updater:
    <<: *common
    image: ${UPDATER_IMAGE:-ghcr.io/marcelolucas11/office-imp-updater}:${OFFICE_IMP_VERSION:-latest}
    environment:
      UPDATER_TOKEN: ${UPDATER_TOKEN:-}
      INSTALL_DIR: ${INSTALL_DIR:-/opt/office-imp}
      SERVICES: app whisper
      HEALTH_URL: http://app:3000/api/health
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${INSTALL_DIR:-/opt/office-imp}:${INSTALL_DIR:-/opt/office-imp}
    deploy:
      resources:
        limits: { memory: 128M }

  # Opcional (perfil "caddy"): proxy com HTTPS automático, para VPS em que as portas 80/443 estão livres.
  caddy:
    <<: *common
    profiles: ["caddy"]
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      RTC_DOMAIN: ${RTC_DOMAIN:-rtc.localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - officeimp_caddy:/data
      - officeimp_caddy_config:/config
    depends_on: [app, livekit]

volumes:
  officeimp_pg:
  officeimp_data:
  officeimp_models:
  officeimp_caddy:
  officeimp_caddy_config:
