name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  test:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm spdx --check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Scripts de infraestrutura
        run: |
          bash -n infra/install.sh
          shellcheck -S error infra/install.sh infra/scripts/*.sh infra/whisper/entrypoint.sh
          docker compose -f infra/docker-compose.dev.yml config -q
          cp infra/.env.example /tmp/.env && sed -i 's/^\(POSTGRES_PASSWORD\|APP_SECRET\|APP_ENCRYPTION_KEY\|LIVEKIT_API_KEY\|LIVEKIT_API_SECRET\|UPDATER_TOKEN\)=$/\1=valor-de-teste-para-validar-o-compose/' /tmp/.env
          docker compose -f infra/docker-compose.prod.yml --env-file /tmp/.env --profile caddy config -q
      - run: pnpm build

  e2e:
    name: Ponta a ponta (3 pessoas, áudio e vídeo reais)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @office-imp/server build && pnpm --filter @office-imp/web build
      - name: LiveKit, Egress e Whisper (áudio, vídeo, gravação e transcrição de verdade)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          DATA="$RUNNER_TEMP/oi-data"
          mkdir -p "$DATA/meetings" && chmod -R 777 "$DATA"
          # fala de exemplo do repositório do whisper.cpp, tocada pelo microfone falso do navegador
          curl -fsSL -o "$RUNNER_TEMP/jfk.wav" https://raw.githubusercontent.com/ggml-org/whisper.cpp/v1.7.4/samples/jfk.wav
          ffmpeg -loglevel error -y -i "$RUNNER_TEMP/jfk.wav" -ar 48000 -ac 1 -c:a pcm_s16le "$RUNNER_TEMP/fala.wav"
          # o LiveKit anuncia o IP da máquina (como o IP público na VPS), alcançável pelo navegador e pelo Egress
          NODE_IP="$(hostname -I | awk '{print $1}')"
          export NODE_IP MEETINGS_DIR="$DATA/meetings"
          docker compose -f infra/docker-compose.dev.yml --profile notes up -d --build redis livekit egress whisper
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:7880 >/dev/null 2>&1 && break; sleep 2; done
          for i in $(seq 1 100); do curl -fsS -o /dev/null http://127.0.0.1:8080/ 2>/dev/null && break; sleep 3; done
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          docker compose -f infra/docker-compose.dev.yml --profile notes ps
          {
            echo "E2E_DATA_DIR=$DATA"
            echo "E2E_FAKE_AUDIO=$RUNNER_TEMP/fala.wav"
          } >> "$GITHUB_ENV"
      - name: Navegador
        run: pnpm --filter @office-imp/e2e exec playwright install --with-deps chromium
      - name: Testes
        run: pnpm e2e
        env:
          CI: "1"
          E2E_LIVEKIT: "1"
          E2E_EGRESS: "1"
          E2E_WHISPER: "1"
          LIVEKIT_URL: ws://127.0.0.1:7880
          EGRESS_OUT_DIR: /out
          WHISPER_URL: http://127.0.0.1:8080
          WHISPER_LANGUAGE: en
      - name: Logs do LiveKit, do Egress e do Whisper (se falhar)
        if: failure()
        run: |
          docker compose -f infra/docker-compose.dev.yml --profile notes logs --tail 150 livekit
          docker compose -f infra/docker-compose.dev.yml --profile notes logs --tail 250 egress
          docker compose -f infra/docker-compose.dev.yml --profile notes logs --tail 80 whisper
          ls -laR "$RUNNER_TEMP/oi-data/meetings" || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  docker:
    name: Imagens Docker e instalação de produção
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Imagem do app
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: office-imp:ci
          build-args: APP_VERSION=0.0.0-ci
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - name: Imagem do Whisper
        uses: docker/build-push-action@v6
        with:
          context: infra/whisper
          load: true
          tags: office-imp-whisper:ci
          cache-from: type=gha,scope=whisper
          cache-to: type=gha,scope=whisper,mode=max
      - name: Imagem do atualizador
        uses: docker/build-push-action@v6
        with:
          context: apps/updater
          load: true
          tags: office-imp-updater:ci
      - name: Instala como em produção (install.sh)
        run: |
          sudo env OFFICE_IMP_NONINTERACTIVE=1 DOMAIN=localhost RTC_DOMAIN=rtc.localhost PUBLIC_IP=127.0.0.1 \
            PROXY_MODE=none PUBLIC_URL=http://127.0.0.1:3080 LIVEKIT_PUBLIC_URL=ws://127.0.0.1:7880 COOKIE_SECURE=false \
            OFFICE_IMP_VERSION=ci OFFICE_IMP_IMAGE=office-imp WHISPER_IMAGE=office-imp-whisper UPDATER_IMAGE=office-imp-updater \
            OFFICE_IMP_SKIP_PULL=1 WHISPER_MODEL=tiny SETUP_TOKEN=token-de-instalacao-do-ci \
            bash infra/install.sh
      - name: Teste de fumaça
        run: bash infra/scripts/smoke.sh
      - name: Logs (se falhar)
        if: failure()
        run: cd /opt/office-imp && sudo docker compose ps && sudo docker compose logs --tail 120
